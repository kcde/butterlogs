# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Source of truth for the PowerSync instance's Sync Streams. Paste into the
# PowerSync dashboard (Sync Streams) and deploy after every change.

config:
  edition: 3

streams:
  # PRD §6: everything in the businesses the user belongs to. Price history is
  # server only and never synced.
  business_data:
    auto_subscribe: true
    with:
      user_businesses: SELECT business_id FROM business_members WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM businesses WHERE id IN user_businesses
      - SELECT * FROM business_members WHERE user_id = auth.user_id()
      - SELECT * FROM categories WHERE business_id IN user_businesses
      - SELECT * FROM overhead_items WHERE business_id IN user_businesses
      - SELECT * FROM ingredients WHERE business_id IN user_businesses
      - SELECT * FROM recipes WHERE business_id IN user_businesses
      - SELECT * FROM recipe_sections WHERE business_id IN user_businesses
      - SELECT * FROM recipe_lines WHERE business_id IN user_businesses
      - SELECT * FROM recipe_overhead_lines WHERE business_id IN user_businesses
